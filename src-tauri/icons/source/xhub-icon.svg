<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Xhub app icon: an iPhone and an Android phone linked through one hub. Source for `tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0ea5b7"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g filter="url(#shadow)">
    <!-- link between the phones -->
    <path d="M436 512 H588" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round"/>
    <!-- iPhone -->
    <rect x="232" y="292" width="204" height="440" rx="54" fill="#f8fafc"/>
    <rect x="250" y="310" width="168" height="404" rx="40" fill="url(#screenA)"/>
    <rect x="304" y="326" width="60" height="20" rx="10" fill="#0f172a"/>
    <!-- Android phone -->
    <rect x="588" y="292" width="204" height="440" rx="34" fill="#f8fafc"/>
    <rect x="606" y="310" width="168" height="404" rx="22" fill="url(#screenB)"/>
    <circle cx="690" cy="336" r="11" fill="#0f172a"/>
    <!-- hub -->
    <circle cx="512" cy="512" r="58" fill="#f8fafc"/>
    <circle cx="512" cy="512" r="28" fill="#0ea5b7"/>
  </g>
</svg>
